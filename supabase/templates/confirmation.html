<!doctype html>
<html lang="ja">
  <body style="margin:0;background:#f6f7fb;color:#182033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:40px 20px">
      <div style="background:#ffffff;border:1px solid #e5e8f0;border-radius:20px;padding:32px">
        <p style="margin:0;color:#6b8aff;font-size:13px;font-weight:700;letter-spacing:.08em">LAYERTALK</p>
        <h1 style="margin:16px 0 8px;font-size:24px;line-height:1.4">ログインコード</h1>
        <p style="margin:0;color:#697086;font-size:14px;line-height:1.7">LayerTalkアプリに次の6桁コードを入力してください。<br>Enter this six-digit code in the LayerTalk app.</p>
        <div style="margin:28px 0;padding:18px;border-radius:14px;background:#f2f4ff;color:#263056;font-size:34px;font-weight:700;letter-spacing:.22em;text-align:center">{{ .Token }}</div>
        <p style="margin:0;color:#8a90a2;font-size:12px;line-height:1.7">コードは10分で期限切れになります。心当たりがない場合は、このメールを無視してください。<br>This code expires in 10 minutes. If you did not request it, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>

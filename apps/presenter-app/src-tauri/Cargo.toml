[package]
name = "presenter-app"
version = "0.1.0"
description = "LayerTalk presenter overlay"
authors = ["LayerTalk"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "presenter_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# **`macos-private-api` は落とした（App Store 2.5.1）。**
# あの feature は wry に `setValue:forKey:@"drawsBackground"` という private な KVC キーを
# 使わせるためのもので、透過 WKWebView の正体だった。いまは透過が要る窓から webview を外し、
# Core Animation で直接描いている（`overlay_render.rs`）。**戻さないこと。**
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
# 発表レポートの保存先を選ばせて書き出すため。WKWebView は <a download> を
# 無視するので、この 2 つが無いとレポートは永久に生成されない。
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
uuid = "1"

# NSWindow のレベルと collectionBehavior を直接いじるために使う。
# Tauri の alwaysOnTop (NSFloatingWindowLevel) だけでは Keynote / PowerPoint の
# スライドショーより前面に出られないため、objc の生メッセージ送信が必要。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# オーバーレイ窓を自前の NSWindow にするために使う。tao が作る窓は他アプリの
# 全画面 Space（Canva のプレゼン等）に入れないため（罠 #9）。
# tao が既に依存しているのでロックは変わらない。
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSPanel",
  "NSGraphics",
  "NSColor",
  "NSResponder",
  "NSScreen",
  "NSView",
  # 縁取り文字（lt-overlay-text 相当）を NSAttributedString で組むために要る。
  "NSAttributedString",
  "NSFont",
  "NSParagraphStyle",
  # 組んだ文字列の実寸を測る（`NSAttributedString::size`）。見積もり幅だと
  # 末尾が切れることがあり、140文字を省略しない方針に反する。
  "NSStringDrawing",
  # システム設定（画面収録）を開くのに使う。`/usr/bin/open` のサブプロセス起動は
  # App Sandbox が拒否するので、NSWorkspace の openURL: に寄せてある。
  "NSWorkspace",
  # prefers-reduced-motion 相当（`NSWorkspace::accessibilityDisplayShouldReduceMotion`）。
  # フキダシは移植元が静止表示へ分岐するので、同じ判定が要る。
  "NSAccessibility",
  # カスタムスタンプの PNG を復号して CGImage にする。**画像デコーダは足さない** —
  # JS が bytes を base64 で渡し、復号は NSImage に任せる。
  "NSImage",
  "NSGraphicsContext",
  "objc2-core-foundation",
] }
# NSWorkspace へ渡す NSURL。既定 feature には入っていない。
objc2-foundation = { version = "0.3", features = ["NSURL"] }
# オーバーレイをネイティブ描画するために使う（App Store 2.5.1）。
# WKWebView を透過させる公開 API は macOS に存在しない（WebKit bug 200528 が未解決）ので、
# 透過が要る窓からは webview を外し、Core Animation で直接描く。
# crate 自体は screencapturekit / objc2-app-kit 経由で既に入っていたが、
# CALayer / CAAnimation の feature を立てると objc2-metal・block2・libc が新たに増える
# （Core Animation が Metal 上に載っているため）。ビルド時間と .app のサイズに効く。
objc2-quartz-core = { version = "0.3", features = [
  "CALayer",
  "CATextLayer",
  "CAAnimation",
  "CAMediaTiming",
  "CAMediaTimingFunction",
  "CATransaction",
  # フキダシの左下のしっぽ（三角形）。CALayer の角丸では作れないので CGPath を引く。
  "CAShapeLayer",
  "objc2-core-foundation",
] }
core-graphics = "0.25"
# フキダシのしっぽ（三角形）の CGPath を引くため。`CAShapeLayer::setPath` が要求するのは
# **`objc2-core-graphics` の CGPath** で、上の `core-graphics` crate のものとは別型。
# 既に objc2-quartz-core 経由で Cargo.lock に入っているので、直接依存にしても lock は動かない。
objc2-core-graphics = { version = "0.3", features = ["CGPath"] }
# `macos_14_0` は `SCScreenshotManager`（質問到着時の単発撮影フォールバック）を出すためだけの
# **モジュールと Swift の `#if` を開けるフラグ**。デプロイメントターゲットは上がらず、
# Swift 側に `#available(macOS 14.0, *)` があるので macOS 13 では Err が返るだけ。
screencapturekit = { version = "8", features = ["macos_14_0"] }

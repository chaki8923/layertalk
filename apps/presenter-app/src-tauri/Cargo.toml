[package]
name = "presenter-app"
version = "1.0.0"
description = "LayerTalk presenter overlay"
authors = ["LayerTalk"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "presenter_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
# 透過オーバーレイはAppKit/Core Animationで描画し、WKWebViewのprivate APIは使わない。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# 発表レポートの保存先を選ばせて書き出すため。WKWebView は <a download> を
# 無視するので、この 2 つが無いとレポートは永久に生成されない。
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
uuid = "1"

# NSWindow のレベルと collectionBehavior を直接いじるために使う。
# Tauri の alwaysOnTop (NSFloatingWindowLevel) だけでは Keynote / PowerPoint の
# スライドショーより前面に出られないため、objc の生メッセージ送信が必要。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# オーバーレイ窓を自前の NSWindow にするために使う。tao が作る窓は他アプリの
# 全画面 Space（Canva のプレゼン等）に入れないため（罠 #9）。
# tao が既に依存しているのでロックは変わらない。
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSPanel",
  # 法務ページ・サポート・画面収録設定を開くのに使う。App Sandbox では
  # `/usr/bin/open` の spawn が通らないので、Launch Services を直接叩く。
  "NSWorkspace",
  "NSGraphics",
  "NSColor",
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSImage",
  "NSImageRep",
  # 縁取り文字（lt-overlay-text 相当）を NSAttributedString で組むために要る。
  "NSAttributedString",
  "NSFont",
  "NSParagraphStyle",
  # 組んだ文字列の実寸を測る（`NSAttributedString::size`）。見積もり幅だと
  # 末尾が切れることがあり、140文字を省略しない方針に反する。
  "NSStringDrawing",
  "objc2-core-foundation",
] }
objc2-foundation = "0.3"
# オーバーレイをネイティブ描画するために使う（App Store 2.5.1）。
# WKWebView を透過させる公開 API は macOS に存在しない（WebKit bug 200528 が未解決）ので、
# 透過が要る窓からは webview を外し、Core Animation で直接描く。
# crate 自体は screencapturekit / objc2-app-kit 経由で既に入っていたが、
# CALayer / CAAnimation の feature を立てると objc2-metal・block2・libc が新たに増える
# （Core Animation が Metal 上に載っているため）。ビルド時間と .app のサイズに効く。
objc2-quartz-core = { version = "0.3", features = [
  "CALayer",
  "CATextLayer",
  "CAAnimation",
  "CAMediaTiming",
  "CAMediaTimingFunction",
  "CATransaction",
  "objc2-core-foundation",
] }
core-graphics = "0.25"
# `macos_14_0` は `SCScreenshotManager`（質問到着時の単発撮影フォールバック）を出すためだけの
# **モジュールと Swift の `#if` を開けるフラグ**。デプロイメントターゲットは上がらず、
# Swift 側に `#available(macOS 14.0, *)` があるので macOS 13 では Err が返るだけ。
screencapturekit = { version = "8", features = ["macos_14_0"] }

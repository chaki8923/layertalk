[package]
name = "presenter-app"
version = "0.1.0"
description = "LayerTalk presenter overlay"
authors = ["LayerTalk"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "presenter_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: tauri.conf.json の app.macOSPrivateApi と対で必要。
# これが無いと macOS で背景を本当に透過できない（Mac App Store 配布は不可になる）。
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NSWindow のレベルと collectionBehavior を直接いじるために使う。
# Tauri の alwaysOnTop (NSFloatingWindowLevel) だけでは Keynote / PowerPoint の
# スライドショーより前面に出られないため、objc の生メッセージ送信が必要。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
